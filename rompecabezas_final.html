<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1er paso</title>
<style>
:root { color-scheme:light; --bg:#f5f5fa; --ink:#171717; --accent:#6565d8; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; padding:22px 14px 36px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
main { width:min(100%,680px); text-align:center; }
h1 { margin:4px 0 8px; font-size:clamp(1.45rem,5vw,2rem); }
p { margin:8px 0 16px; color:#555; line-height:1.45; }
#board { width:min(94vw,620px); aspect-ratio:1077 / 1407; margin:18px auto; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(6,1fr); overflow:hidden; border:3px solid #222; border-radius:8px; background:white; touch-action:manipulation; }
.piece { min-width:0; min-height:0; padding:0; border:1px solid rgba(255,255,255,.9); border-radius:0; background-repeat:no-repeat; cursor:pointer; }
.piece.selected { outline:4px solid var(--accent); outline-offset:-4px; filter:brightness(1.12); z-index:2; }
.piece:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; z-index:3; }
#board.solved { border:0; border-radius:0; }
#board.solved .piece { border:0; }
#complete { display:none; width:min(94vw,620px); height:auto; margin:18px auto; }
#confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10; }
button#shuffle { border:0; border-radius:999px; padding:12px 22px; font:inherit; font-weight:700; cursor:pointer; background:#222; color:white; }
#status { display:block; width:fit-content; min-height:1.5em; font-weight:800; font-size:1.1rem; margin:14px auto; padding:10px 16px; border-radius:12px; background:#fff; color:#28285f; border:2px solid #7777cc; }
.small { font-size:.88rem; color:#666; }
</style>
</head>

const COLS=6, ROWS=6, TOTAL=COLS*ROWS;
const board=document.getElementById('board');
const complete=document.getElementById('complete');
const status=document.getElementById('status');
const canvas=document.getElementById('confetti');
const ctx=canvas.getContext('2d');
complete.src=IMAGE;
let order=[], selected=null, finished=false, frame=null, bits=[];

function shuffleOrder(){
  order=Array.from({length:TOTAL},(_,i)=>i);
  for(let i=TOTAL-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  if(order.every((v,i)=>v===i)) [order[0],order[1]]=[order[1],order[0]];
}
function render(){
  board.innerHTML='';
  board.style.display=finished?'none':'grid';
  complete.style.display=finished?'block':'none';
  order.forEach((pieceIndex,position)=>{
    const tile=document.createElement('button');
    tile.type='button';
    tile.className='piece';
    tile.setAttribute('aria-label',`Pieza ${position+1}`);
    const col=pieceIndex%COLS, row=Math.floor(pieceIndex/COLS);
    tile.style.backgroundImage=`url("${IMAGE}")`;
    tile.style.backgroundSize=`${COLS*100}% ${ROWS*100}%`;
    tile.style.backgroundPosition=`${col/(COLS-1)*100}% ${row/(ROWS-1)*100}%`;
    if(selected===position) tile.classList.add('selected');
    tile.addEventListener('click',()=>choose(position));
    board.appendChild(tile);
  });
  const correct=order.filter((v,i)=>v===i).length;
  status.textContent=finished?'¡Rompecabezas completado! 🎉':`🧩 Piezas en su lugar: ${correct} / ${TOTAL}`;
}
function choose(position){
  if(finished)return;
  if(selected===null){selected=position;render();return;}
  if(selected===position){selected=null;render();return;}
  [order[selected],order[position]]=[order[position],order[selected]];
  selected=null;
  if(order.every((v,i)=>v===i)){
    finished=true;
    render();
    celebrate();
  } else render();
}
function celebrate(){
  if(frame)cancelAnimationFrame(frame);
  const dpr=window.devicePixelRatio||1;
  canvas.width=window.innerWidth*dpr; canvas.height=window.innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bits=Array.from({length:220},()=>({
    x:Math.random()*window.innerWidth,
    y:-20-Math.random()*window.innerHeight*.7,
    size:4+Math.random()*8,
    speed:2+Math.random()*4,
    drift:(Math.random()-.5)*3,
    angle:Math.random()*Math.PI,
    spin:(Math.random()-.5)*.2,
    color:['#ff4d6d','#ffd166','#06d6a0','#118ab2','#9b5de5','#f15bb5'][Math.floor(Math.random()*6)]
  }));
  const start=performance.now();
  function animate(now){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    bits.forEach(b=>{
      b.y+=b.speed;b.x+=b.drift+Math.sin(b.y/25)*.6;b.angle+=b.spin;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.fillStyle=b.color;
      ctx.fillRect(-b.size/2,-b.size/2,b.size,b.size*.65);ctx.restore();
    });
    bits=bits.filter(b=>b.y<window.innerHeight+20);
    if(now-start<6500&&bits.length)frame=requestAnimationFrame(animate);
    else{ctx.clearRect(0,0,window.innerWidth,window.innerHeight);frame=null;}
  }
  frame=requestAnimationFrame(animate);
}
function shuffle(){
  if(frame)cancelAnimationFrame(frame);
  frame=null;ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  finished=false;selected=null;shuffleOrder();render();
}
document.getElementById('shuffle').addEventListener('click',shuffle);
shuffle();
</script>
